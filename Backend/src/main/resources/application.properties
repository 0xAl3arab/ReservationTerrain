spring.application.name=ReservationTerrain
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Reservation}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/reservation-realm/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/reservation-realm

keycloak.server-url=http://localhost:8180
keycloak.realm=reservation-realm
keycloak.admin-realm=master
# Client used by the backend itself to call the Keycloak admin API (realm master)
keycloak.client-id=admin-cli
# Client used to log users in (reservation-realm). Must put realm roles in the token:
# tokens from admin-cli in reservation-realm have no realm_access, so hasRole("ADMIN") fails.
keycloak.login-client-id=reservation-frontend
keycloak.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# TRACE logs every request/token detail; switch back to TRACE only when debugging security
logging.level.org.springframework.security=INFO

# Renvoie le message des ResponseStatusException au frontend (ex: "Un compte existe déjà")
server.error.include-message=always
server.error.include-stacktrace=never

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
